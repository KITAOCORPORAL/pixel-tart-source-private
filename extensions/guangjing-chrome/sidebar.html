<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>光镜 · 当前页采集</title><link rel="stylesheet" href="sidebar.css"><script type="module" src="sidebar.js"></script></head><body><main>
<header><div class="brand"><span class="mark">光</span><div><strong>当前页采集</strong><small>光镜 · 原图送到本机素材库</small></div><button id="history" class="quiet" title="查看原有单图记录">单图记录</button></div><button id="scan" class="primary wide">扫描当前页</button><p class="hint">只扫描你主动打开的当前页。扫描不批量下载原图。</p></header>
<section class="jobSource"><select id="jobs" aria-label="持久化采集队列"><option value="">尚无扫描队列</option></select><p id="page" class="page">点击扫描，选择当前页图片。</p></section>
<section class="filters" aria-label="图片筛选"><div class="filterRow"><label>最小宽度<input id="minWidth" type="number" min="0" placeholder="不限"></label><label>最小高度<input id="minHeight" type="number" min="0" placeholder="不限"></label><label>格式<select id="format"><option value="ALL">全部格式</option><option>JPEG</option><option>PNG</option><option>WEBP</option><option>GIF</option><option>SVG</option><option value="UNKNOWN">未知格式</option></select></label></div><label class="inline"><input id="includeUnknown" type="checkbox" checked>保留尺寸未知的项目</label><div class="selectRow"><button id="selectAll">全选筛选结果</button><button id="selectNone">取消全部勾选</button><span id="counts">0张</span></div></section>
<details id="destination" open><summary>统一发送目的地</summary><label>素材库<select id="library"><option value="">请选择素材库</option></select></label><div class="destinationRow"><label>项目<select id="project"><option value="">不关联项目</option></select></label><label>灵感板<select id="board"><option value="">不加入灵感板</option></select></label></div><button id="refreshDestinations" class="quiet">刷新目的地</button></details>
<section class="sendbar"><button id="send" class="primary">发送所选</button><button id="continue">继续未完成</button><button id="retry">重试失败</button><button id="cancel" class="quiet">取消后续项</button><button id="reconcile" class="quiet" hidden>核对已提交回执</button><progress id="progress" max="1" value="0"></progress><p id="progressText">尚未发送</p></section>
<p id="status" role="status" aria-live="polite">准备就绪。</p><section id="grid" class="grid" aria-label="当前页图片候选"><div class="empty">扫描当前页后，图片会显示在这里。</div></section><footer>收到桌面真实回执才标记成功。取消不撤回已提交项，会继续核对该项回执。</footer>
</main></body></html>
