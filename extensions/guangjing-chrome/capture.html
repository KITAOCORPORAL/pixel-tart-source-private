<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>发送到光镜</title><link rel="stylesheet" href="capture.css"><script type="module" src="capture.js"></script></head><body><main><header><span class="brand">光镜 · 浏览器采集</span><h1>发送到光镜</h1><p>原图入库，收到桌面回执后才完成。</p></header><section id="queue"></section><section id="editor" hidden><img id="preview" alt="本次读取的原图预览" hidden><p id="source" class="source"></p><button id="fetch">读取 / 重试原图</button><p id="permissionHint" class="hint"></p><label>素材库<select id="library"><option value="">请选择素材库</option></select></label><label>项目<select id="project"><option value="">仅入素材库，不关联项目</option></select></label><label>灵感板<select id="board"><option value="">不加入灵感板</option></select></label><div class="actions"><button id="reload">刷新目的地</button><button id="send" class="primary" disabled>发送原图</button></div><p id="status" role="status" aria-live="polite"></p><pre id="receipt" hidden></pre></section><footer>只处理你主动采集的图片。桌面未确认时，待处理项会保留。</footer></main></body></html>
