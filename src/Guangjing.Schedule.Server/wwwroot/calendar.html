<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>光镜 · 手机档期</title><link rel="stylesheet" href="/calendar-client.css"><script src="/calendar-client.js" defer></script></head><body><header><strong>光镜 <small>手机档期</small></strong><span id="device">受保护的日历</span></header><main><h1>拍摄档期</h1><nav><button id="today">当日</button><button id="upcoming">近期 14 天</button><button id="refresh">刷新</button></nav><p id="range"></p><p id="message" role="status" aria-live="polite">正在连接日历…</p><section id="list" aria-label="预约列表"></section><section id="detail" hidden><h2 id="title"></h2><p id="summary"></p><p id="notes"></p><form id="edit"><label>开始时间<input id="start" type="datetime-local" required></label><label>结束时间<input id="end" type="datetime-local" required></label><label>预约状态<select id="status"></select></label><p id="version"></p><button id="save" type="submit">保存修改</button><button id="reload" type="button">重新读取预约</button></form><div id="conflicts" hidden><p id="conflict-message"></p><button id="save-anyway">仍然保存</button><button id="allow-overlap">允许本预约重叠后保存</button></div><p id="receipt" role="status" aria-live="polite"></p></section><noscript>请启用 Safari JavaScript 后重新打开。</noscript></main></body></html>
