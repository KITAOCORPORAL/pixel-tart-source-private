<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>光镜 · 策划审稿</title><link rel="stylesheet" href="/review.css"><script src="/review.js" defer></script></head><body>
<header><div class="brand"><span class="aperture">◉</span> 光镜 <small>PIXEL TART</small></div><span class="crumb">工作区　/　策划中心</span><div class="grow"></div><span id="sync" role="status"></span><button id="team" hidden>项目成员</button></header>
<main id="login" class="welcome"><div class="eyebrow">PLANNING ROOM　/　私人审稿间</div><h1>打开策划审稿间</h1><p>首次加入使用负责人提供的邀请。换电脑请使用本人的迁移码，署名和席位会随你保留。</p><form id="join"><label>邀请或个人迁移码<input id="code" type="password" autocomplete="off" required autofocus></label><button class="primary">进入策划</button></form></main>
<main id="workspace" hidden><nav><div class="eyebrow">策划工作台</div><strong id="railTitle"></strong><div class="rule"></div><div class="eyebrow">项目内容</div><button data-page="all" class="nav active">策划总览</button><button data-page="text" class="nav">拍摄简报</button><button data-page="shot" class="nav">镜头清单与分镜</button><button data-page="image" class="nav">参考图</button><div class="rule"></div><div class="eyebrow">在线与编辑位置</div><div id="presence"></div><div class="foot"><span id="tier"></span><button id="identity">我的身份</button></div></nav>
<section id="paper"><div class="eyebrow">摄影提案　/　CREATIVE BRIEF</div><h1 id="title"></h1><div class="subtitle">拍摄工作文档 <span>·</span> 编辑与批注</div><div id="content"></div></section>
<aside><div class="asideHead"><div class="eyebrow">REVIEW NOTES</div><h2>讨论 <small id="count"></small></h2><div class="filters"><button id="allThreads" aria-pressed="true">全部</button><button id="openThreads" aria-pressed="false">待处理</button></div></div><section id="compose" hidden><strong id="anchorName"></strong><label>批注内容<textarea id="note" rows="3" placeholder="把拍摄意见留在此处…"></textarea></label><button id="sendNote" class="primary">发布批注</button><button id="cancelNote">取消</button></section><div id="threads"></div><div id="issues"></div></aside></main>
<dialog id="panel"><form method="dialog"><button class="close" aria-label="关闭面板">×</button></form><div id="panelBody"></div></dialog><div id="toast" role="status" hidden></div></body></html>
